# A non-zero exit blocks the commit. parallel: false runs commands in file order.
# Biome rewrites staged files before the typecheck. The typecheck and tests
# cover packages changed since HEAD, not the whole repo.
pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,css,mjs,cjs}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    check-affected:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck:affected && pnpm test:affected

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
