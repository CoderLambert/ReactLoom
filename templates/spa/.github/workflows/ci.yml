name: CI

# Action majors: actions/checkout@v7, pnpm/action-setup@v6, actions/setup-node@v7, actions/cache@v6.
# Renovate helpers:pinGitHubActionDigests rewrites these tags to commit SHAs.
# This generated workflow has no concurrency group.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Run Lighthouse CI
        type: boolean
        default: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node --input-type=commonjs -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
            playwright-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-ai-rules-sync.mjs
      - run: pnpm exec turbo run lint typecheck test build
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec turbo run test:e2e

  lighthouse:
    if: ${{ (github.event_name != 'workflow_dispatch' && vars.LIGHTHOUSE_CI != 'false') || (github.event_name == 'workflow_dispatch' && inputs.lighthouse == true && vars.LIGHTHOUSE_CI != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node --input-type=commonjs -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
            playwright-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Point Lighthouse at Playwright Chromium
        run: echo "CHROME_PATH=$(node scripts/print-playwright-chrome.mjs)" >> "$GITHUB_ENV"
      - run: pnpm exec turbo run lighthouse
